name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build and validate Chrome package
        run: npm run build
      - name: Verify Chrome Web Store identity
        run: npm run check:store -- kimfpnbfjfmpkjpcmfnjeoefakhcoclh
      - name: Upload draft package
        uses: actions/upload-artifact@v4
        with:
          name: branilist-sync-${{ runner.os }}
          path: dist/
          if-no-files-found: error
