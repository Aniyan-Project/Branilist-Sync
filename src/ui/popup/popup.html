<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Branilist Sync</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 330px; margin: 0; padding: 18px; color: #111; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      h2 { font-size: 13px; margin: 14px 0 6px; }
      p { line-height: 1.45; opacity: .78; margin: 6px 0; }
      .card { border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
      .muted { opacity: .65; font-size: 12px; }
      .warning { border-color: #d9a400; background: #fff9df; }
      .success { border-color: #79b886; background: #f1fff4; }
      .error { border-color: #c85d5d; background: #fff3f3; }
      button { width: 100%; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-top: 8px; }
      a { color: inherit; }
      button:disabled { cursor: wait; opacity: .6; }
      [hidden] { display: none !important; }
      select { width: 100%; padding: 8px; }
      #oauth { overflow-wrap: anywhere; white-space: pre-line; }
      #current-media, #pending-media, #sync { display: none; }
    </style>
  </head>
  <body>
    <h1>Branilist Sync</h1>
    <p>Acompanhamento automático seguro de episódios e capítulos.</p>

    <div id="account" class="card" role="status">Verificando conta…</div>

    <section id="current-section">
      <h2>Página atual</h2>
      <div id="current-media" class="card">
        <strong id="current-media-title"></strong>
        <div id="current-media-detail" class="muted"></div>
      </div>
      <p id="current-empty" class="muted">Nenhuma mídia suportada detectada nesta página.</p>
    </section>

    <section id="pending-section" hidden>
      <h2>Pendências</h2>
      <label id="pending-label">Evento pendente <select id="pending"></select></label>

      <div id="pending-media" class="card">
        <strong id="pending-media-title"></strong>
        <div id="pending-media-detail" class="muted"></div>
      </div>

      <div id="sync" class="card" role="status" aria-live="polite">
        <strong id="sync-title"></strong>
        <div id="sync-message"></div>
        <div id="sync-candidates" class="muted"></div>
      </div>
      <button id="retry" type="button" hidden>Tentar novamente</button>
    </section>

    <button id="refresh" type="button">Atualizar estado</button>
    <button id="auth">Vincular conta</button>
    <button id="open" type="button">Abrir Branilist</button>
    <details><summary>Diagnóstico de conexão</summary><p id="oauth" class="muted"></p></details>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
