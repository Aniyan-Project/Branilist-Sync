<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branilist Sync</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { width: 420px; height: 590px; margin:0; overflow:hidden; background:#0b111b; color:#e9f1fb; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr); }
    .topbar { display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px solid #1b283a; background:linear-gradient(180deg,#101927,#0d1521); }
    .logo { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-weight:900; background:linear-gradient(135deg,#5fb3ff,#7b6cff); color:white; box-shadow:0 8px 24px rgba(82,145,255,.22); }
    .brand { min-width:0; flex:1; }
    .brand strong { display:block; font-size:15px; }
    .brand small { display:block; margin-top:2px; color:#70839e; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .avatar { width:32px; height:32px; border-radius:50%; border:1px solid #2b3b52; background:#182537; color:#b8c7da; font-weight:800; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:8px 10px; border-bottom:1px solid #1b283a; background:#0d1521; }
    .tab { border:0; background:transparent; color:#7588a3; border-radius:9px; padding:8px 5px; font-size:11px; font-weight:750; }
    .tab.active { color:#dceaff; background:#17253a; box-shadow:inset 0 0 0 1px #233853; }
    .views { overflow:hidden; position:relative; }
    .view { display:none; height:100%; overflow:auto; padding:14px; }
    .view.active { display:block; }
    .section-title { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:#6e83a0; }
    .card { border:1px solid #203047; background:#111b2a; border-radius:13px; padding:12px; box-shadow:0 8px 20px rgba(0,0,0,.14); }
    .empty { color:#71839d; font-size:12px; line-height:1.5; padding:18px 4px; text-align:center; }
    .media-title { font-weight:800; font-size:14px; line-height:1.3; }
    .muted { color:#7285a1; font-size:11px; line-height:1.45; }
    .status-pill { display:inline-flex; align-items:center; gap:5px; margin-top:8px; padding:4px 8px; border-radius:999px; font-size:10px; font-weight:800; background:#17324d; color:#8fcbff; }
    .toolbar { display:flex; gap:8px; margin-bottom:10px; }
    .input,.select { width:100%; min-height:36px; border:1px solid #25364d; border-radius:9px; background:#0d1623; color:#eaf3ff; padding:0 10px; outline:none; }
    .input:focus,.select:focus { border-color:#539eea; }
    .library-list { display:grid; gap:7px; }
    .library-item { width:100%; display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid #1d2b40; border-radius:11px; background:#101a29; color:inherit; padding:7px; text-align:left; }
    .library-item:hover { border-color:#31517a; background:#142137; }
    .cover { width:44px; height:62px; object-fit:cover; border-radius:7px; background:#172235; }
    .library-item strong { display:block; font-size:12px; line-height:1.3; }
    .progress { margin-top:5px; color:#8094af; font-size:10px; }
    .score { color:#b0c4dd; font-size:11px; font-weight:750; padding-right:3px; }
    .detail { display:none; }
    .detail.active { display:block; }
    .detail-hero { position:relative; min-height:130px; overflow:hidden; border-radius:14px; background:#131f30; margin-bottom:12px; }
    .banner { width:100%; height:130px; object-fit:cover; opacity:.45; }
    .detail-overlay { position:absolute; inset:0; background:linear-gradient(180deg,transparent 20%,#101a29 100%); }
    .detail-copy { position:absolute; left:12px; right:12px; bottom:11px; display:flex; align-items:end; gap:10px; }
    .detail-cover { width:58px; height:82px; border-radius:8px; object-fit:cover; background:#182537; }
    .detail-copy strong { font-size:14px; line-height:1.25; }
    .detail-desc { color:#9badc4; font-size:11px; line-height:1.55; max-height:95px; overflow:auto; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    .field { display:grid; gap:4px; color:#7185a0; font-size:10px; font-weight:700; }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .btn { border:1px solid #2b3e59; border-radius:9px; background:#18263a; color:#d8e6f7; padding:9px 11px; font-size:11px; font-weight:800; }
    .btn.primary { border-color:#4d95de; background:#4d95de; color:#08121f; }
    .btn:disabled { opacity:.55; cursor:wait; }
    .notice { border:1px solid #5c4920; background:#2a2415; border-radius:10px; padding:10px; color:#d9be73; font-size:11px; line-height:1.5; }
    .error { color:#ff9d9d; font-size:11px; margin-top:8px; }
    .pending-card { margin-top:9px; }
    details { margin-top:10px; color:#7185a0; font-size:10px; }
    #oauth { overflow-wrap:anywhere; white-space:pre-line; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="logo">B</div>
    <div class="brand"><strong>Branilist Sync</strong><small id="account-summary">Verificando conta…</small></div>
    <button id="profile-button" class="avatar" type="button" aria-label="Conta">B</button>
  </header>

  <nav class="tabs" aria-label="Navegação">
    <button class="tab active" data-tab="current" type="button">Atual</button>
    <button class="tab" data-tab="library" type="button">Minha Lista</button>
    <button class="tab" data-tab="pending" type="button">Pendências</button>
    <button class="tab" data-tab="settings" type="button">Config.</button>
  </nav>

  <main class="views">
    <section class="view active" data-view="current">
      <h2 class="section-title">Página atual</h2>
      <div id="current-media" class="card" hidden>
        <div id="current-media-title" class="media-title"></div>
        <div id="current-media-detail" class="muted"></div>
        <div class="status-pill">Detecção ativa</div>
      </div>
      <div id="current-empty" class="empty">Abra um episódio ou capítulo em um site compatível para acompanhar automaticamente.</div>
    </section>

    <section class="view" data-view="library">
      <div id="library-browser">
        <div class="toolbar">
          <input id="library-search" class="input" type="search" placeholder="Pesquisar na sua lista">
          <select id="library-status" class="select">
            <option value="">Todos</option>
            <option value="CURRENT">Assistindo/Lendo</option>
            <option value="PLANNING">Planejando</option>
            <option value="COMPLETED">Completo</option>
            <option value="PAUSED">Pausado</option>
            <option value="DROPPED">Abandonado</option>
          </select>
        </div>
        <div id="library-list" class="library-list"></div>
        <div id="library-empty" class="empty" hidden>Nenhuma obra encontrada.</div>
        <div id="library-error" class="error"></div>
      </div>

      <div id="library-detail" class="detail">
        <button id="detail-back" class="btn" type="button">← Voltar</button>
        <div id="detail-hero" class="detail-hero"></div>
        <div id="detail-description" class="detail-desc"></div>
        <form id="detail-form">
          <div class="form-grid">
            <label class="field">Status
              <select id="detail-status" class="select">
                <option value="CURRENT">Assistindo/Lendo</option>
                <option value="PLANNING">Planejando</option>
                <option value="COMPLETED">Completo</option>
                <option value="PAUSED">Pausado</option>
                <option value="DROPPED">Abandonado</option>
              </select>
            </label>
            <label class="field">Progresso<input id="detail-progress" class="input" type="number" min="0" step="1"></label>
            <label class="field">Nota (0–10)<input id="detail-score" class="input" type="number" min="0.5" max="10" step="0.5"></label>
            <label class="field">Repetições<input id="detail-repeat" class="input" type="number" min="0" step="1"></label>
          </div>
          <div class="actions"><button id="detail-save" class="btn primary" type="submit">Salvar na lista</button></div>
          <div id="detail-feedback" class="error"></div>
        </form>
      </div>
    </section>

    <section class="view" data-view="pending">
      <h2 class="section-title">Pendências</h2>
      <div id="pending-empty" class="empty">Nenhuma pendência de sincronização.</div>
      <div id="pending-content" hidden>
        <select id="pending" class="select"></select>
        <div id="pending-media" class="card pending-card" hidden>
          <div id="pending-media-title" class="media-title"></div>
          <div id="pending-media-detail" class="muted"></div>
        </div>
        <div id="sync" class="notice pending-card" hidden>
          <strong id="sync-title"></strong>
          <div id="sync-message"></div>
          <div id="sync-candidates" class="muted"></div>
        </div>
        <button id="retry" class="btn primary" type="button" hidden>Tentar novamente</button>
      </div>
    </section>

    <section class="view" data-view="settings">
      <h2 class="section-title">Conta e extensão</h2>
      <div id="account" class="card">Verificando conta…</div>
      <div class="actions">
        <button id="auth" class="btn" type="button">Vincular conta</button>
        <button id="open" class="btn primary" type="button">Abrir Branilist</button>
      </div>
      <button id="refresh" class="btn" type="button">Atualizar estado</button>
      <details><summary>Diagnóstico de conexão</summary><p id="oauth"></p></details>
    </section>
  </main>
</div>
<script type="module" src="./popup.ts"></script>
</body>
</html>
